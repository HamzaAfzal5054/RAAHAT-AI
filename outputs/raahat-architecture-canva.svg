<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111D"/><stop offset="1" stop-color="#0B2636"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27D9FF"/><stop offset="1" stop-color="#3478FF"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF7657"/><stop offset="1" stop-color="#FF4967"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="7" refY="6" orient="auto"><path d="M0,0 L0,12 L9,6 z" fill="#27D9FF"/></marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:58px;font-weight:800;fill:#ECF7FF;letter-spacing:2px}.sub{font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:600;fill:#27D9FF;letter-spacing:5px}.h{font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:750;fill:#ECF7FF}.p{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:450;fill:#9BB1C1}.chip{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:700;fill:#27D9FF;letter-spacing:1px}.num{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:800;fill:#06111D}.line{stroke:#27D9FF;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1800" fill="url(#bg)"/>
  <circle cx="1420" cy="170" r="260" fill="#27D9FF" opacity=".035"/><circle cx="1420" cy="170" r="170" fill="none" stroke="#27D9FF" opacity=".10" stroke-width="2"/>
  <text x="100" y="105" class="sub">SYSTEM ARCHITECTURE</text>
  <text x="100" y="180" class="title">RAAHAT AI</text>
  <text x="100" y="224" class="p">Urban Flood Response Intelligence · Detect → Verify → Predict → Respond</text>
  <rect x="100" y="265" width="1400" height="2" fill="#27D9FF" opacity=".25"/>

  <!-- Citizen layer -->
  <rect x="480" y="315" width="640" height="135" rx="28" fill="#102A3A" stroke="#27D9FF" stroke-width="2"/>
  <circle cx="550" cy="382" r="36" fill="url(#cyan)"/><text x="542" y="390" class="num">1</text>
  <text x="615" y="370" class="h">Citizen App</text><text x="615" y="407" class="p">Location · water level · situation · photo evidence</text>
  <path d="M800 450 V505" class="line"/>

  <!-- Firebase -->
  <rect x="480" y="515" width="640" height="120" rx="28" fill="#102A3A" stroke="#27D9FF" stroke-opacity=".45"/>
  <circle cx="550" cy="575" r="36" fill="#FFC857"/><text x="542" y="583" class="num">2</text>
  <text x="615" y="566" class="h">Firebase / Secure Data Layer</text><text x="615" y="603" class="p">Real-time reports · media · geospatial events</text>
  <path d="M800 635 V690" class="line"/>

  <!-- Aggregator -->
  <rect x="420" y="700" width="760" height="125" rx="28" fill="#102A3A" stroke="#27D9FF" stroke-width="2"/>
  <circle cx="490" cy="762" r="36" fill="url(#cyan)"/><text x="482" y="770" class="num">3</text>
  <text x="555" y="754" class="h">Incident Aggregator</text><text x="555" y="792" class="p">Clusters citizen signals by time, distance and affected zone</text>

  <!-- input feeds -->
  <rect x="95" y="880" width="400" height="135" rx="25" fill="#0D2233" stroke="#42E7A5" stroke-opacity=".55"/>
  <text x="130" y="930" class="chip" fill="#42E7A5">ENVIRONMENT SIGNAL</text><text x="130" y="972" class="h">Weather Mock Feed</text><text x="130" y="999" class="p">Rainfall intensity · trend</text>
  <rect x="600" y="880" width="400" height="135" rx="25" fill="#0D2233" stroke="#FFC857" stroke-opacity=".55"/>
  <text x="635" y="930" class="chip" fill="#FFC857">MOBILITY SIGNAL</text><text x="635" y="972" class="h">Traffic Mock Feed</text><text x="635" y="999" class="p">Congestion · speed anomaly</text>
  <rect x="1105" y="880" width="400" height="135" rx="25" fill="#0D2233" stroke="#FF7657" stroke-opacity=".55"/>
  <text x="1140" y="930" class="chip" fill="#FF7657">INFRASTRUCTURE</text><text x="1140" y="972" class="h">Drainage &amp; Road Risk</text><text x="1140" y="999" class="p">Capacity · elevation · vulnerability</text>
  <path d="M800 825 V850 H295 V880" class="line"/><path d="M800 825 V880" class="line"/><path d="M800 825 V850 H1305 V880" class="line"/>
  <path d="M295 1015 V1065 H800" class="line"/><path d="M800 1015 V1065" class="line"/><path d="M1305 1015 V1065 H800" class="line"/>

  <!-- fusion -->
  <rect x="400" y="1075" width="800" height="145" rx="32" fill="url(#cyan)" filter="url(#glow)"/>
  <text x="455" y="1135" style="font-family:Inter,Arial;font-size:16px;font-weight:800;fill:#06111D;letter-spacing:2px">DETERMINISTIC SAFETY LAYER</text>
  <text x="455" y="1180" style="font-family:Inter,Arial;font-size:32px;font-weight:850;fill:#06111D">Signal Fusion &amp; Severity Engine</text>
  <text x="455" y="1208" style="font-family:Inter,Arial;font-size:15px;fill:#092031">Citizen 30% · Weather 25% · Traffic 20% · Drainage 15% · Road 10%</text>
  <path d="M800 1220 V1275" class="line"/>

  <!-- Gemini -->
  <rect x="400" y="1285" width="800" height="135" rx="30" fill="#14283E" stroke="#9D8CFF" stroke-width="2"/>
  <circle cx="470" cy="1352" r="36" fill="#9D8CFF"/><text x="462" y="1360" class="num">5</text>
  <text x="535" y="1343" class="h">Gemini AI Reasoning Layer</text><text x="535" y="1381" class="p">Severity explanation · flood forecast · response plan</text>
  <path d="M800 1420 V1475" class="line"/>

  <!-- Simulation -->
  <rect x="400" y="1485" width="800" height="125" rx="30" fill="#102A3A" stroke="#27D9FF" stroke-width="2"/>
  <circle cx="470" cy="1547" r="36" fill="url(#cyan)"/><text x="462" y="1555" class="num">6</text>
  <text x="535" y="1539" class="h">Response Simulation Engine</text><text x="535" y="1577" class="p">Compare strategies · predict outcomes · orchestrate actions</text>
  <path d="M800 1610 V1650" class="line"/>

  <!-- outputs -->
  <rect x="100" y="1660" width="330" height="90" rx="22" fill="#102A3A" stroke="#FF4967"/><text x="130" y="1700" class="h">Traffic Simulation</text><text x="130" y="1732" class="p">Closure &amp; rerouting</text>
  <rect x="470" y="1660" width="330" height="90" rx="22" fill="#102A3A" stroke="#FFC857"/><text x="500" y="1700" class="h">Dispatch Simulation</text><text x="500" y="1732" class="p">Teams · ticket · ETA</text>
  <rect x="840" y="1660" width="330" height="90" rx="22" fill="#102A3A" stroke="#42E7A5"/><text x="870" y="1700" class="h">Resident Alerts</text><text x="870" y="1732" class="p">SMS · push · community</text>
  <rect x="1210" y="1660" width="290" height="90" rx="22" fill="url(#red)"/><text x="1240" y="1700" style="font-family:Inter,Arial;font-size:24px;font-weight:800;fill:white">Authority Dashboard</text><text x="1240" y="1732" style="font-family:Inter,Arial;font-size:16px;fill:#FFE9ED">Command &amp; impact</text>
  <path d="M800 1650 H265 V1660" class="line"/><path d="M800 1650 H635 V1660" class="line"/><path d="M800 1650 H1005 V1660" class="line"/><path d="M800 1650 H1355 V1660" class="line"/>
</svg>
